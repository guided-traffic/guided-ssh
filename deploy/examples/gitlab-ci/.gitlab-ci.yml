# Reference pipeline: server provisioning via Ansible with a short-lived
# SSH certificate from guided-ssh — no static keys in CI variables.
# Docs: docs/gitlab-ci.md
#
# Prerequisites:
# - guided-ssh server with GSSH_CI_ISSUER=<this GitLab instance>
# - CI grant for this project (gssh-admin ci-grant create --project … )
# - gssh binary in the image or available as a download

stages: [provision]

provision:
  stage: provision
  image: alpine:3.22
  # Only on the protected main branch (matching the CI grant's protected_only).
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"
  # GitLab issues an OIDC token per job with this audience; guided-ssh
  # only accepts aud: guided-ssh (server default, GSSH_CI_AUDIENCE).
  id_tokens:
    GSSH_CI_TOKEN:
      aud: guided-ssh
  variables:
    GSSH_API_URL: https://gssh.example.com
    # Self-signed server? SPKI pin instead of CA trust:
    # GSSH_PIN_SHA256: "<base64-encoded sha-256 of the server SPKI>"
  before_script:
    - apk add --no-cache openssh-client ansible curl
    # Fetch the gssh CLI (alternatively bake it into the runner image).
    - curl -fsSLo /usr/local/bin/gssh https://releases.example.com/gssh-linux-amd64
    - chmod +x /usr/local/bin/gssh
    # Start the job's ssh-agent; the certificate lives only there.
    - eval $(ssh-agent -s)
    # Exchange the job token for a certificate (KeyID ci:<project>:<pipeline>:<job>).
    - gssh ci-login
    # Trust the target hosts' host certificates (instead of maintaining known_hosts).
    - mkdir -p ~/.ssh
    - echo "@cert-authority * $(curl -fsSL $GSSH_API_URL/v1/ca/bundle/host)" > ~/.ssh/known_hosts
  script:
    # Ansible uses the ssh-agent automatically — no key material in the job.
    - ansible-playbook -i inventory.yml site.yml
