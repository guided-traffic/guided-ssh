# Example playbook: minimal walkthrough for certificate-based
# provisioning from GitLab CI (docs/gitlab-ci.md). Authentication comes
# entirely from the job's ssh-agent — no key material in the repo.
- name: Target hosts reachable and provisionable
  hosts: webserver
  gather_facts: false
  tasks:
    - name: Check connectivity
      ansible.builtin.ping:

    - name: Example task — set motd
      become: false
      ansible.builtin.copy:
        dest: /home/{{ ansible_user }}/provisioned-by-ci
        content: "provisioned by pipeline {{ lookup('env', 'CI_PIPELINE_ID') | default('local', true) }}\n"
        mode: "0644"
