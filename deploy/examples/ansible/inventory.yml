# Inventory template for certificate-based provisioning (guided-ssh).
# ansible_user must be the principal of a CI grant that matches the tags of
# the target hosts (docs/gitlab-ci.md).
all:
  children:
    webserver:
      hosts:
        web1.example.com:
        web2.example.com:
      vars:
        ansible_user: deploy
        # No ansible_ssh_private_key_file: the CI job's ssh-agent
        # provides key + certificate (gssh ci-login).
