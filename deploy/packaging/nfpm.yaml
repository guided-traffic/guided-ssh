# nfpm configuration for gssh-agentd (deb + rpm).
# Build: make packages  (expects nfpm in PATH and bin/gssh-agentd-linux-<arch>)
# Environment variables: VERSION (SemVer without v prefix), ARCH (amd64|arm64)
name: gssh-agentd
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: admin
maintainer: Guided Traffic <mail@hans-fischer.com>
description: |
  guided-ssh host agent: host enrollment, automatic renewal of the
  SSH host certificate, TrustedUserCAKeys maintenance, and an
  AuthorizedPrincipalsCommand helper with a fail-closed cache.
homepage: https://github.com/guided-traffic/guided-ssh
license: Apache-2.0
contents:
  # nfpm expands env vars in metadata (name/arch/version), but NOT in
  # contents[].src globs. That's why `make packages` provides the matching
  # binary per arch under this stable path (see Makefile target packages).
  - src: bin/pkg/gssh-agentd
    dst: /usr/bin/gssh-agentd
    file_info:
      mode: 0755
  # Single source of the unit: internal/agentdist (also go:embed from there).
  - src: internal/agentdist/gssh-agentd.service
    dst: /lib/systemd/system/gssh-agentd.service
    file_info:
      mode: 0644
scripts:
  postinstall: deploy/packaging/postinstall.sh
