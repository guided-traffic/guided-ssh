    AAAECBTwEC8PukXJMCMBs7gHrt97wUAXY3lyHhRlWeuhaGtDSM6Crg7+8tPNG0GoW18RW8
    k/hFU3P1tgaqa/+bM/OcAAAALkVYQU1QTEUgT05MWSAtIGd1aWRlZC1zc2ggdXNlciBjYS
    AtIERPIE5PVCBVU0UBAgMEBQYH
    -----END OPENSSH PRIVATE KEY-----
  # OpenSSH-Private-Key-PEM der Host-CA (GSSH_CA_HOST_KEY_FILE).
  # Erzeugung: ssh-keygen -t ed25519 -f host-ca -N '' -C 'guided-ssh host ca'
  host-ca: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW
