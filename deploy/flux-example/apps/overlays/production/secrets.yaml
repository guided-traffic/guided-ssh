# ACHTUNG: Beispieldatei mit Platzhaltern. Im echten GitOps-Repo MUSS diese
# Datei SOPS-verschlüsselt sein (sops --encrypt --in-place secrets.yaml,
# Regel in .sops.yaml) — niemals Klartext-Secrets committen.
apiVersion: v1
kind: Secret
metadata:
  name: guided-ssh-db
  namespace: guided-ssh
type: Opaque
stringData:
  # Postgres-Verbindungsdaten als einzelne Keys (extern oder CloudNativePG,
  # siehe Chart-README; Key-Namen anpassbar via secrets.db.keys).
  host: postgres.example.com
  port: "5432"
  username: gssh
  password: REPLACE_ME
  database: gssh
  sslmode: require
---
apiVersion: v1
kind: Secret
metadata:
  name: guided-ssh-ca
  namespace: guided-ssh
type: Opaque
stringData:
  # 32 Bytes Base64 (AES-256): openssl rand -base64 32
  ca-master-key: REPLACE_ME_BASE64_32_BYTES
---
apiVersion: v1
kind: Secret
metadata:
  name: guided-ssh-sync-oidc
  namespace: guided-ssh
type: Opaque
stringData:
  # Client-Secret des IdP-Service-Accounts gssh-grants-sync (siehe README)
  client-secret: REPLACE_ME
---
# CA-Keys für secrets.ca.mode=self-managed (siehe README, Abschnitt
# "Self-managed CA-Keys"). Wird nur wirksam, wenn der Modus im
# helmrelease-patch.yaml eingeschaltet ist — sonst liegt das Secret ungenutzt
# im Namespace.
#
# !!! DIE HIER EINGETRAGENEN SCHLÜSSEL SIND WEGWERF-BEISPIELE ("EXAMPLE —
# !!! DO NOT USE"): sie stehen im öffentlichen guided-ssh-Repo und sind damit
# !!! jedem bekannt. Vor dem ersten Einsatz KOMPLETT durch eigene, selbst
# !!! erzeugte Keys ersetzen (Erzeugung: siehe README) und die Datei mit dem
# !!! eigenen age-Key verschlüsseln — der Inhalt hier ist Klartext, nicht
# !!! SOPS-Ciphertext.
