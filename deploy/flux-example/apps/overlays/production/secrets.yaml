# WARNING: example file with placeholders. In the real GitOps repo this
# file MUST be SOPS-encrypted (sops --encrypt --in-place secrets.yaml,
# rule in .sops.yaml) — never commit plaintext secrets.
apiVersion: v1
kind: Secret
metadata:
  name: guided-ssh-db
  namespace: guided-ssh
type: Opaque
stringData:
  # Postgres connection data as individual keys (external or CloudNativePG,
  # see chart README; key names customizable via secrets.db.keys).
  host: postgres.example.com
  port: "5432"
  username: gssh
  password: REPLACE_ME
  database: gssh
  sslmode: require
---
apiVersion: v1
kind: Secret
metadata:
  name: guided-ssh-ca
  namespace: guided-ssh
type: Opaque
stringData:
  # 32 bytes base64 (AES-256): openssl rand -base64 32
  ca-master-key: REPLACE_ME_BASE64_32_BYTES
---
apiVersion: v1
kind: Secret
metadata:
  name: guided-ssh-sync-oidc
  namespace: guided-ssh
type: Opaque
stringData:
  # Client secret of the IdP service account gssh-grants-sync (see README)
  client-secret: REPLACE_ME
---
# Web-UI login (BFF): client secret of the server's own confidential OIDC
# client (config.oidc.server.existingSecret in helmrelease-patch.yaml).
# Uncomment both to enable the UI login.
# apiVersion: v1
# kind: Secret
# metadata:
#   name: guided-ssh-server-oidc
#   namespace: guided-ssh
# type: Opaque
# stringData:
#   client-secret: REPLACE_ME
---
# CA keys for secrets.ca.mode=self-managed (see README, section
# "Self-managed CA keys"). Only takes effect when the mode is switched on
# in helmrelease-patch.yaml — otherwise this secret sits unused in the
# namespace.
#
# !!! THE KEYS CHECKED IN HERE ARE THROWAWAY EXAMPLES ("EXAMPLE —
# !!! DO NOT USE"): they live in the public guided-ssh repo and are
# !!! therefore known to everyone. Before first use, replace them
# !!! COMPLETELY with your own, freshly generated keys (generation: see
# !!! README) and encrypt the file with your own age key — the content
# !!! here is plaintext, not SOPS ciphertext.
