apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: guided-ssh
  namespace: guided-ssh
spec:
  chart:
    spec:
      # Production pins exactly: upgrade = bump this line via a merge
      # request; Flux runs the helm upgrade, the migrations run
      # automatically (init container with advisory lock).
      version: "0.1.0"
  values:
    replicaCount: 2
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    config:
      oidc:
        issuer: https://idp.example.com/realms/example
        clientID: gssh-cli
      ci:
        issuer: https://gitlab.example.com
      groups:
        admin: gssh-admins
        auditor: gssh-auditors
    agent:
      # External DNS name of the agent API (mTLS, TLS passthrough — hence
      # LoadBalancer instead of ingress).
      tlsNames: gssh-agent.example.com
      service:
        type: LoadBalancer
    ingress:
      enabled: true
      className: nginx
      hosts:
        - host: gssh.example.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: guided-ssh-tls
          hosts:
            - gssh.example.com
