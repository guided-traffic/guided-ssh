apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: guided-ssh
  namespace: guided-ssh
spec:
  chart:
    spec:
      # Staging follows patch/minor releases automatically: Flux checks the
      # Helm repo on chart.spec.interval and rolls out new versions without
      # a commit — an early warning before production, which is pinned, catches up.
      version: ">=0.1.0 <0.2.0"
  values:
    config:
      oidc:
        issuer: https://idp.staging.example.com/realms/example
        client:
          clientID: gssh-cli
      groups:
        admin: gssh-admins
        auditor: gssh-auditors
    ingress:
      enabled: true
      className: nginx
      hosts:
        - host: gssh.staging.example.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: guided-ssh-tls
          hosts:
            - gssh.staging.example.com
    # Agent mTLS endpoint (port 8443) through a second, TLS-PASSTHROUGH
    # ingress — no extra LoadBalancer IP. The controller must pass the raw
    # stream through (SNI routing); a terminating ingress breaks the agent's
    # client-certificate handshake. ingress-nginx additionally needs
    # --enable-ssl-passthrough on the controller itself.
    # The host below also lands in the agent certificate's SANs and, with
    # hostRollout.enabled, becomes https://<host> in every install command.
    # agent:
    #   ingress:
    #     enabled: true
    #     className: nginx
    #     host: gssh-agent.staging.example.com
    #     annotations:
    #       nginx.ingress.kubernetes.io/ssl-passthrough: "true"
    #   # Real agent source IP in the audit log: the controller prepends a
    #   # PROXY header, the server trusts it only from the listed senders.
    #   # Roll this out FIRST, the controller's send-proxy annotation second —
    #   # the reverse order breaks the agent endpoint (chart README).
    #   proxyProtocol:
    #     enabled: true
    #     trusted:
    #       # Headless Service of the controller pods — a ClusterIP name would
    #       # resolve to an address that never appears as a source.
    #       - haproxy-pods.ingress.svc.cluster.local
