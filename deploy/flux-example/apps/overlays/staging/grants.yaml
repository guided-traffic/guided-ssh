# Target state of the access rules (declarative, GitOps): the sync CronJob
# reconciles with `gssh-admin apply -f grants.yaml` — entries missing here
# get deleted. Format: see docs/grants.md.
grants:
  - group: gssh-devs
    tags:
      env: staging
    principals: [deploy]
    sudo: true
    max_validity: 8h
# Omitting the ci_grants section = CI grants untouched; an empty list
# (ci_grants: []) deletes all of them.
ci_grants:
  - project: infra/ansible
    ref: main
    protected_only: true
    environment: staging
    tags:
      env: staging
    principals: [deploy]
    max_validity: 1h
