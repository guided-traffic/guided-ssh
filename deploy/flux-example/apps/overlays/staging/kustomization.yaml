apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: guided-ssh
resources:
  - ../../base/guided-ssh
  # Commit SOPS-encrypted (see ../../../.sops.yaml and README) —
  # Flux decrypts on apply (decryption.provider: sops).
  - secrets.yaml
patches:
  - path: helmrelease-patch.yaml
  - path: sync-config-patch.yaml
# grants.yaml (target state of the access rules) ends up as a ConfigMap for
# the sync CronJob. No hash suffix: every job pod reads the current state
# on start anyway.
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: guided-ssh-grants
    files:
      - grants.yaml
