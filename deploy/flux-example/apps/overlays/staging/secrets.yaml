# WARNING: example file with placeholders. In the real GitOps repo this
# file MUST be SOPS-encrypted (sops --encrypt --in-place secrets.yaml,
# rule in .sops.yaml) — never commit plaintext secrets.
apiVersion: v1
kind: Secret
metadata:
  name: guided-ssh-db
  namespace: guided-ssh
type: Opaque
stringData:
  # Postgres connection data as individual keys (external or CloudNativePG,
  # see chart README; key names customizable via secrets.db.keys).
  host: postgres.example.com
  port: "5432"
  username: gssh
  password: REPLACE_ME
  database: gssh
  sslmode: require
---
apiVersion: v1
kind: Secret
metadata:
  name: guided-ssh-ca
  namespace: guided-ssh
type: Opaque
stringData:
  # 32 bytes base64 (AES-256): openssl rand -base64 32
  ca-master-key: REPLACE_ME_BASE64_32_BYTES
---
apiVersion: v1
kind: Secret
metadata:
  name: guided-ssh-sync-oidc
  namespace: guided-ssh
type: Opaque
stringData:
  # Client secret of the IdP service account gssh-grants-sync (see README)
  client-secret: REPLACE_ME
