# HelmRelease for guided-ssh. The chart version is pinned here (production)
# or as a range (staging overlay) — an upgrade is therefore a git commit:
# bump the version, review, merge; Flux runs the helm upgrade and the
# DB migrations run automatically as an init container (advisory lock).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: guided-ssh
  namespace: guided-ssh
spec:
  interval: 30m
  timeout: 5m
  chart:
    spec:
      chart: guided-ssh
      version: "0.1.0"
      sourceRef:
        kind: HelmRepository
        name: guided-ssh
      # How often Flux checks the Helm repo for new versions (relevant for
      # version ranges like in the staging overlay).
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # Environment-specific settings (issuer, ingress, replicas, …) are patched by the overlays.
  values:
    image:
      repository: docker.io/guidedtraffic/guided-ssh
    secrets:
      # SOPS-encrypted secrets from the overlay: Postgres access
      # (individual keys) and CA master key kept separate.
      db:
        existingSecret: guided-ssh-db
      ca:
        existingSecret: guided-ssh-ca
