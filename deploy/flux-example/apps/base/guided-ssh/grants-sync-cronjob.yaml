# Declarative grants via GitOps: grants.yaml lives versioned in the repo
# (overlay, configMapGenerator) and is periodically reconciled with
# `gssh-admin apply` — the file is the target state, changes to it run as a
# reviewable merge request.
#
# Authentication: client-credentials flow (GSSH_CLIENT_ID/-SECRET) against
# the IdP — a service account client whose tokens carry the server's
# audience (GSSH_OIDC_CLIENT_ID) and the admin group in the groups claim;
# see README (Grants sync section) for setup.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: guided-ssh-grants-sync
  namespace: guided-ssh
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: gssh-admin
              # gssh-admin lives in the server image (distroless, no shell) —
              # keep the tag matching the rolled-out appVersion.
              image: docker.io/guidedtraffic/guided-ssh:0.1.0
              command:
                - /usr/local/bin/gssh-admin
                - apply
                - -f
                - /etc/guided-ssh/grants.yaml
                - --config
                - /etc/guided-ssh/config.yaml
              env:
                - name: GSSH_CLIENT_ID
                  value: gssh-grants-sync
                - name: GSSH_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: guided-ssh-sync-oidc
                      key: client-secret
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
              volumeMounts:
                - name: config
                  mountPath: /etc/guided-ssh
                  readOnly: true
          volumes:
            # A directory built from both ConfigMaps: config.yaml (base,
            # patched by overlays) + grants.yaml (configMapGenerator in the
            # overlay). Jobs start fresh pods and therefore always read the
            # current state.
            - name: config
              projected:
                sources:
                  - configMap:
                      name: guided-ssh-sync-config
                  - configMap:
                      name: guided-ssh-grants
