# CLI configuration for the grants-sync CronJob (gssh-admin). api_url points
# to the chart's in-cluster service; issuer/client_id are patched by the
# overlays to match the environment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: guided-ssh-sync-config
  namespace: guided-ssh
data:
  config.yaml: |
    api_url: http://guided-ssh
    issuer: https://idp.example.com/realms/example
    client_id: gssh-cli
