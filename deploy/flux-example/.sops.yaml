# SOPS configuration for the GitOps repo: every secrets.yaml is encrypted
# with age; encrypted_regex leaves metadata in plaintext so diffs stay
# reviewable. Replace the public key with your own (age-keygen,
# see README section "Secrets with SOPS").
creation_rules:
  - path_regex: .*secrets\.yaml$
    encrypted_regex: ^(data|stringData)$
    age: age1hl09mf56vc9dupa9nk8gt0zcjj4sea59r9c5wkq9p5a8j5685pkqcny5rh
