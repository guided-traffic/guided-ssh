# Flux Kustomization for the staging cluster: syncs the staging overlay
# from the GitOps repo (GitRepository flux-system is created by
# `flux bootstrap`) and decrypts SOPS secrets with the age key in the
# sops-age secret.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: guided-ssh
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/overlays/staging
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
