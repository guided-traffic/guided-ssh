apiVersion: v2
name: guided-ssh
description: >-
  SSH certificate authority with IdP-backed access control: short-lived user
  certificates via OIDC, host enrollment with mTLS agents, GitLab CI
  certificates, audit log and web UI.
type: application
# Lint baseline (ct check-version-increment). On release, version and
# appVersion are set from the git tag (see .github/workflows/build.yml, job
# helm-chart); the published chart version = app version = image tag.
version: 0.0.1
appVersion: "0.0.1"
kubeVersion: ">=1.27.0-0"
home: https://github.com/guided-traffic/guided-ssh
sources:
  - https://github.com/guided-traffic/guided-ssh
maintainers:
  - name: Guided Traffic
    url: https://github.com/guided-traffic
keywords:
  - ssh
  - certificate-authority
  - oidc
  - security
dependencies:
  # Only for development/testing (postgresql.enabled=true); in production an
  # external PostgreSQL or CloudNativePG is connected instead — see README.
  - name: postgresql
    version: "18.8.12"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled
annotations:
  artifacthub.io/license: Apache-2.0
