# Default values for the guided-ssh chart.
# Secrets are NEVER created by the chart — only existingSecret references
# (compatible with external-secrets and SOPS), see README.

replicaCount: 1

image:
  repository: docker.io/guidedtraffic/guided-ssh
  # Default: chart appVersion
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Secrets (mandatory): existing secrets — the chart creates none.
# Postgres access and CA master key can be referenced separately; both may
# also point to the same secret. Key names are freely assignable so
# existing secrets (e.g. CloudNativePG's app secret) can be used directly
# — details and examples in the README.
secrets:
  db:
    # Name of the secret with the Postgres connection data (mandatory).
    # Example:
    #   kubectl create secret generic guided-ssh-db \
    #     --from-literal=host=db.example.com \
    #     --from-literal=port=5432 \
    #     --from-literal=username=gssh \
    #     --from-literal=password=... \
    #     --from-literal=database=gssh \
    #     --from-literal=sslmode=require
    existingSecret: ""
    # Keys in the secret → GSSH_DB_* env. Adjust to match the existing secret
    # (CloudNativePG app secret: database: dbname, username: user).
    keys:
      # GSSH_DB_HOST
      host: host
      # GSSH_DB_PORT — optional: if the key is missing from the secret, 5432 applies
      port: port
      # GSSH_DB_USER
      username: username
      # GSSH_DB_PASSWORD
      password: password
      # GSSH_DB_NAME
      database: database
      # GSSH_DB_SSLMODE — optional: if the key is missing from the secret, the
      # driver default "prefer" applies
      sslmode: sslmode
  ca:
    # Origin of the CA private keys (GSSH_CA_MODE):
    #   managed      — the server generates them on first start and stores
    #                  them AES-256-GCM-encrypted in the database (default,
    #                  previous behavior).
    #   self-managed — all three CAs (user, host, mtls) come as files from
    #                  a secret (GitOps/SOPS); the database stores no
    #                  private key material. Requires
    #                  secrets.ca.selfManaged.existingSecret.
    mode: managed
    # Name of the secret with the CA master key (mandatory in BOTH modes; may
    # match secrets.db). Example:
    #   kubectl create secret generic guided-ssh-ca \
    #     --from-literal=ca-master-key="$(openssl rand -base64 32)"
    existingSecret: ""
    keys:
      # GSSH_CA_MASTER_KEY — base64, 32 bytes (AES-256)
      masterKey: ca-master-key
    # Only evaluated when mode=self-managed.
    selfManaged:
      # Secret with the four CA files; mounted read-only under mountPath
      # (generation: see README). May match secrets.ca.existingSecret
      # — only the four keys below get mounted.
      existingSecret: ""
      # Key names in the secret. The key name is also the file name under
      # mountPath and thus the value of the respective GSSH_CA_*_FILE variable.
      keys:
        # GSSH_CA_USER_KEY_FILE — OpenSSH private key PEM of the user CA
        userKey: user-ca
        # GSSH_CA_HOST_KEY_FILE — OpenSSH private key PEM of the host CA
        hostKey: host-ca
        # GSSH_CA_MTLS_KEY_FILE — PKCS#8 PEM of the agent mTLS CA key
        mtlsKey: mtls-ca.key
        # GSSH_CA_MTLS_CERT_FILE — X.509 CA certificate of the agent mTLS CA
        mtlsCert: mtls-ca.crt
      # Mount path in the server container (read-only).
      mountPath: /etc/gssh/ca

# Internal database — ONLY for test environments. Starts Postgres as a native
# sidecar (init container with restartPolicy Always, requires Kubernetes >= 1.29)
# in the server pod: reachable only via 127.0.0.1, fixed dev credentials, data
# in an emptyDir — every pod restart begins with an empty database.
# Excludes secrets.db.existingSecret (render error, protection against
# accidental use) and requires replicaCount=1 without autoscaling.
internalDatabase:
  enabled: false
  image: docker.io/library/postgres:18-alpine
  # Separate pull policy: the server's image.pullPolicy (e.g. Never for locally
  # built images) doesn't fit the public Postgres image.
  pullPolicy: IfNotPresent
  resources: {}

# Runtime configuration (ends up as env in the Deployment; 1:1 mapping to the
# server's GSSH_* variables).
config:
  # GSSH_PUBLIC_URL: external public base URL of the server, e.g.
  # https://gssh.example.com — used for the UI login redirect URL, the
  # install_command, the client install gate, and the pin self-dial. Empty ⇒
  # the UI login derives the redirect from the request; host rollout and
  # client install stay disabled (503).
  publicURL: ""
  # User OIDC (IdP). Without an issuer, /v1/sign/user stays disabled.
  # Server and clients use SEPARATE IdP clients: the server authenticates
  # with a client secret (confidential), the clients without one (public).
  oidc:
    # GSSH_OIDC_ISSUER — issuer shared by both OIDC clients below.
    issuer: ""
    # Public OIDC client of the gssh/gssh-admin CLIs — no client secret
    # (authorization code + PKCE, device flow). Also the audience the server
    # expects on bearer tokens; advertised to CLI installs via
    # /v1/ui/config and client.sh.
    client:
      # GSSH_CLIENT_OIDC_CLIENT_ID (required when issuer is set)
      clientID: ""
    # Confidential OIDC client of the server itself: server-side UI login
    # (BFF: /v1/auth/…, session cookie, no CORS against the IdP). clientID
    # and existingSecret must be set together and must name a DIFFERENT IdP
    # client than oidc.client (startup error otherwise); both empty ⇒ UI
    # login disabled.
    server:
      # GSSH_SERVER_OIDC_CLIENT_ID
      clientID: ""
      # Secret with the server's OIDC client secret.
      existingSecret: ""
      # Key in the secret with the client secret (GSSH_SERVER_OIDC_CLIENT_SECRET).
      existingSecretKey: "client-secret"
      # GSSH_SERVER_OIDC_SCOPES (empty = openid,profile,email,groups)
      scopes: ""
  # GitLab CI issuer. Without an issuer, /v1/sign/ci stays disabled.
  ci:
    # GSSH_CI_ISSUER (GitLab base URL)
    issuer: ""
    # GSSH_CI_AUDIENCE (empty = default guided-ssh)
    audience: ""
  # Role groups of the IdP (admin ⊃ auditor). An empty group grants the role
  # to nobody; without any role the web-UI login is rejected.
  groups:
    # GSSH_ADMIN_GROUP (empty ⇒ admin API disabled)
    admin: ""
    # GSSH_AUDITOR_GROUP — all read access incl. audit log and export
    auditor: ""
  # Group sync via the Keycloak admin API (optional).
  keycloak:
    # GSSH_KC_BASE_URL
    baseURL: ""
    # GSSH_KC_REALM
    realm: ""
    # GSSH_KC_CLIENT_ID (empty ⇒ sync disabled)
    clientID: ""
    # GSSH_KC_CLIENT_SECRET from a secret (empty ⇒ not set)
    existingSecret: ""
    existingSecretKey: kc-client-secret
    # GSSH_KC_SYNC_INTERVAL (Go duration, empty = 5m)
    syncInterval: ""
  # Audit streaming (SIEM).
  auditStream:
    # GSSH_AUDIT_STREAM ("true" enables JSON log streaming)
    logs: false
    # GSSH_AUDIT_WEBHOOK_URL
    webhookURL: ""
    # GSSH_AUDIT_STREAM_INTERVAL (Go duration, empty = 10s)
    interval: ""
  # Provisioning of the rules — access rules (host grants) and CI rules.
  # Rules are expected to be managed declaratively (GitOps); in-app editing
  # is opt-in.
  rules:
    # GSSH_MANUAL_RULES: in-app rule editing (web UI + CRUD API). With false
    # the rules pages stay readable but Add/Edit/Delete disappear and the
    # CRUD endpoints answer 403 manual_rules_disabled; the `…/apply`
    # endpoints (gssh-admin apply, sync CronJob) keep working.
    # Combining true with a ConfigMap below is a render error — a file-owned
    # domain rejects every API write, so the buttons would be dead UI.
    manualProvision: false
    host:
      # ConfigMap in the release namespace with the declarative host rules
      # (top-level `grants:` — same schema as `gssh-admin apply`). Set ⇒ the
      # server applies the file at startup (fail fast) and every 30 s, and
      # rejects ALL API writes for host grants (403 rules_file_managed).
      # The chart does NOT create this ConfigMap: it is maintained
      # separately (kustomize configMapGenerator, Flux, plain manifest).
      # GSSH_HOST_RULES_FILE is derived from it.
      existingConfigMap: ""
      # Key inside that ConfigMap; mounted (without subPath, so ConfigMap
      # updates reach the running pod) as /etc/guided-ssh/rules/host/rules.yaml.
      key: host-rules.yaml
    ci:
      # Same for the CI rules (top-level `ci_grants:`), independent of the
      # host domain — GSSH_CI_RULES_FILE.
      existingConfigMap: ""
      key: ci-rules.yaml
  # Rate limiting of the sign/enroll endpoints.
  rateLimit:
    # GSSH_SIGN_RATE_PER_MINUTE (empty = 60; "0" disables it)
    perMinute: ""
    # GSSH_SIGN_FAIL_PER_MINUTE (empty = 10)
    failPerMinute: ""
    # GSSH_RATE_TRUST_PROXY — usually true behind an ingress (client IP from X-Forwarded-For)
    trustProxy: true
  # Additional env entries (list of EnvVar objects).
  extraEnv: []

# Agent API (mTLS) on its own port.
agent:
  enabled: true
  port: 8443
  # GSSH_AGENT_TLS_NAMES: SANs of the mTLS server certificate. Empty ⇒ default
  # "<fullname>-agent.<namespace>.svc" + external access needs the
  # public DNS name, e.g. "gssh-agent.example.com".
  tlsNames: ""
  # Separate service for the agent API; for agents outside the cluster,
  # set type to LoadBalancer — or expose it through agent.ingress below
  # (TLS passthrough). A TLS-terminating ingress does NOT work.
  service:
    enabled: true
    type: ClusterIP
    port: 8443
    annotations: {}
  # Second ingress for the agent mTLS endpoint. Requires an ingress
  # controller doing TLS passthrough (SNI-based routing, raw TCP to the
  # service) — the gssh server terminates mTLS itself; a TLS-terminating
  # ingress breaks the client-certificate handshake.
  ingress:
    enabled: false
    # Class of the passthrough-capable controller (may differ from
    # ingress.className).
    className: ""
    # Public agent hostname (mandatory when enabled), bare DNS name —
    # no scheme, port, path or wildcard.
    host: ""
    # Passthrough is switched on per controller, e.g.
    #   haproxy-ingress.github.io/ssl-passthrough: "true"   (jcmoraisjr)
    #   haproxy.org/ssl-passthrough: "true"                 (haproxytech)
    #   nginx.ingress.kubernetes.io/ssl-passthrough: "true" (ingress-nginx,
    #     controller needs --enable-ssl-passthrough)
    annotations: {}

hostRollout:
  # One-command host install (UI button "Add host"). When true, the
  # required envs are enforced (helm otherwise fails at render time).
  # Requires config.publicURL (https) as the external public URL.
  enabled: false
  # External mTLS agent URL for enrolled agents (mandatory when enabled).
  agentPublicUrl: ""
  pin:
    # Pin source: dial (default) | file | static — see the table in the README.
    source: dial
    # source=static: base64 SPKI pin (openssl snippet in the README).
    static: ""
    # source=file: TLS secret of the ingress; the chart mounts ONLY tls.crt.
    certSecretName: ""
    # Refresh interval of the pin dial (Go duration).
    refreshInterval: 5m
  # Binary downloads per client IP and minute (0 = off).
  downloadRpm: 10

# Prometheus metrics on their own, non-ingress-exposed port.
metrics:
  enabled: true
  port: 9090
  serviceMonitor:
    # Requires the Prometheus Operator CRDs.
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    # Additional labels, e.g. { release: kube-prometheus-stack }
    labels: {}

# DB migrations as an init container (goose, Postgres advisory lock —
# parallel replicas/rollouts are serialized).
migrations:
  enabled: true
  resources: {}

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: gssh.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

# The server doesn't need the Kubernetes API.
automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 2
  periodSeconds: 5

podDisruptionBudget:
  enabled: false
  minAvailable: 1

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

networkPolicy:
  enabled: false
  # Ingress sources for the HTTP port (empty = all); list of
  # NetworkPolicyPeer objects, e.g. namespaceSelector of the ingress controller.
  httpFrom: []
  # Sources for the metrics port (empty = all), e.g. monitoring namespace.
  metricsFrom: []
  # Sources for the agent mTLS port (empty = all; agents usually sit
  # outside the cluster and come in through the LoadBalancer).
  agentFrom: []
  # Leave egress open (DB, IdP, GitLab, and webhook usually sit
  # outside; false ⇒ only DNS + egressRules).
  egressAllowAll: true
  # Custom egress rules, if egressAllowAll=false.
  egressRules: []

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# Dev-only PostgreSQL subchart (bitnami/postgresql). In production: external
# or CloudNativePG, see README.
postgresql:
  enabled: false
  auth:
    username: gssh
    database: gssh
    # Set the password explicitly for development or use existingSecret.
