{{- if and .Values.agent.enabled .Values.agent.service.enabled }}
# Separate service for the agent API (mTLS): agents outside the cluster need
# raw TCP to this port — a LoadBalancer, or a passthrough Ingress in front of
# it (agent.ingress, templates/ingress-agent.yaml). Nothing may terminate TLS.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "guided-ssh.fullname" . }}-agent
  labels:
    {{- include "guided-ssh.labels" . | nindent 4 }}
  {{- with .Values.agent.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.agent.service.type }}
  {{- with .Values.agent.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  ports:
    - name: agent
      port: {{ .Values.agent.service.port }}
      targetPort: agent
      protocol: TCP
  selector:
    {{- include "guided-ssh.selectorLabels" . | nindent 4 }}
{{- end }}
