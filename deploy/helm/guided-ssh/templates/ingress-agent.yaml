{{- if and .Values.agent.enabled .Values.agent.service.enabled .Values.agent.ingress.enabled }}
# Second ingress, only for the agent mTLS API: the controller must route by
# SNI and pass the raw TCP stream through (annotations below) — the gssh
# server terminates mTLS itself, so a TLS-terminating ingress breaks the
# client-certificate handshake. Deliberately no tls: block: there is no
# controller certificate on a passthrough vhost.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "guided-ssh.fullname" . }}-agent
  labels:
    {{- include "guided-ssh.labels" . | nindent 4 }}
  {{- with .Values.agent.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.agent.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.agent.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "guided-ssh.fullname" . }}-agent
                port:
                  name: agent
{{- end }}
