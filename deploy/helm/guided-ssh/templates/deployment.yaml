{{- include "guided-ssh.validateValues" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "guided-ssh.fullname" . }}
  labels:
    {{- include "guided-ssh.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "guided-ssh.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "guided-ssh.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "guided-ssh.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if or .Values.migrations.enabled .Values.internalDatabase.enabled }}
      initContainers:
        {{- if .Values.internalDatabase.enabled }}
        # Internal test database as a native sidecar (restartPolicy Always,
        # Kubernetes >= 1.29): starts before migrate/server, keeps running afterward.
        # Only reachable within the pod (listen_addresses=127.0.0.1); data is ephemeral
        # in the emptyDir — NEVER use in production.
        - name: db
          image: {{ .Values.internalDatabase.image }}
          imagePullPolicy: {{ .Values.internalDatabase.pullPolicy }}
          restartPolicy: Always
          args: ["-c", "listen_addresses=127.0.0.1"]
          env:
            - name: POSTGRES_USER
              value: {{ include "guided-ssh.internalDBUser" . }}
            - name: POSTGRES_PASSWORD
              value: {{ include "guided-ssh.internalDBPassword" . }}
            - name: POSTGRES_DB
              value: {{ include "guided-ssh.internalDBName" . }}
            # Subdirectory: initdb requires 0700/0750 on PGDATA — the
            # emptyDir mount itself is group-writable via fsGroup.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # migrate/server only start once Postgres accepts connections
          # (while initdb runs, only a socket-only temp server listens — the
          # TCP probe deliberately fails then).
          startupProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", {{ include "guided-ssh.internalDBUser" . | quote }}]
            periodSeconds: 2
            failureThreshold: 60
          # The postgres image runs as uid 70 (alpine); write access to the
          # emptyDir comes via fsGroup as a supplementary group. No
          # readOnlyRootFilesystem: the image needs /var/run/postgresql.
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          {{- with .Values.internalDatabase.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: internal-db-data
              mountPath: /var/lib/postgresql/data
        {{- end }}
        {{- if .Values.migrations.enabled }}
        # Migrations run before the server; a Postgres advisory lock
        # serializes parallel init containers across multiple replicas.
        - name: migrate
          image: {{ include "guided-ssh.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          env:
            {{- include "guided-ssh.dbEnv" . | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- with .Values.migrations.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - name: gssh-server
          image: {{ include "guided-ssh.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -listen=:8080
            {{- if .Values.agent.enabled }}
            - -agent-listen=:{{ .Values.agent.port }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - -metrics-listen=:{{ .Values.metrics.port }}
            {{- end }}
          env:
            {{- include "guided-ssh.dbEnv" . | nindent 12 }}
            - name: GSSH_CA_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.ca.existingSecret is required (a Secret with the CA master key, see README)" .Values.secrets.ca.existingSecret }}
                  key: {{ .Values.secrets.ca.keys.masterKey }}
            {{- if eq (include "guided-ssh.caMode" .) "self-managed" }}
            {{- with .Values.secrets.ca.selfManaged }}
            # Self-managed: all three CAs come from the mounted secret,
            # the database holds no private key material. Rotation =
            # commit a new key (see README).
            - name: GSSH_CA_MODE
              value: self-managed
            - name: GSSH_CA_USER_KEY_FILE
              value: {{ include "guided-ssh.caFile" (dict "mountPath" .mountPath "key" .keys.userKey) | quote }}
            - name: GSSH_CA_HOST_KEY_FILE
              value: {{ include "guided-ssh.caFile" (dict "mountPath" .mountPath "key" .keys.hostKey) | quote }}
            - name: GSSH_CA_MTLS_KEY_FILE
              value: {{ include "guided-ssh.caFile" (dict "mountPath" .mountPath "key" .keys.mtlsKey) | quote }}
            - name: GSSH_CA_MTLS_CERT_FILE
              value: {{ include "guided-ssh.caFile" (dict "mountPath" .mountPath "key" .keys.mtlsCert) | quote }}
            {{- end }}
            {{- end }}
            {{- include "guided-ssh.env" (dict "name" "GSSH_PUBLIC_URL" "value" .Values.config.publicURL) | nindent 12 }}
            {{- include "guided-ssh.env" (dict "name" "GSSH_OIDC_ISSUER" "value" .Values.config.oidc.issuer) | nindent 12 }}
            {{- include "guided-ssh.env" (dict "name" "GSSH_CLIENT_OIDC_CLIENT_ID" "value" .Values.config.oidc.client.clientID) | nindent 12 }}
            {{- include "guided-ssh.env" (dict "name" "GSSH_SERVER_OIDC_CLIENT_ID" "value" .Values.config.oidc.server.clientID) | nindent 12 }}
            {{- if .Values.config.oidc.server.existingSecret }}
            - name: GSSH_SERVER_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.oidc.server.existingSecret }}
                  key: {{ .Values.config.oidc.server.existingSecretKey }}
            {{- end }}
            {{- include "guided-ssh.env" (dict "name" "GSSH_SERVER_OIDC_SCOPES" "value" .Values.config.oidc.server.scopes) | nindent 12 }}
            {{- include "guided-ssh.env" (dict "name" "GSSH_CI_ISSUER" "value" .Values.config.ci.issuer) | nindent 12 }}
            {{- include "guided-ssh.env" (dict "name" "GSSH_CI_AUDIENCE" "value" .Values.config.ci.audience) | nindent 12 }}
            {{- include "guided-ssh.env" (dict "name" "GSSH_ADMIN_GROUP" "value" .Values.config.groups.admin) | nindent 12 }}
            {{- include "guided-ssh.env" (dict "name" "GSSH_AUDITOR_GROUP" "value" .Values.config.groups.auditor) | nindent 12 }}
            {{- include "guided-ssh.env" (dict "name" "GSSH_KC_BASE_URL" "value" .Values.config.keycloak.baseURL) | nindent 12 }}
            {{- include "guided-ssh.env" (dict "name" "GSSH_KC_REALM" "value" .Values.config.keycloak.realm) | nindent 12 }}
            {{- include "guided-ssh.env" (dict "name" "GSSH_KC_CLIENT_ID" "value" .Values.config.keycloak.clientID) | nindent 12 }}
            {{- if .Values.config.keycloak.existingSecret }}
            - name: GSSH_KC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.keycloak.existingSecret }}
                  key: {{ .Values.config.keycloak.existingSecretKey }}
            {{- end }}
            {{- include "guided-ssh.env" (dict "name" "GSSH_KC_SYNC_INTERVAL" "value" .Values.config.keycloak.syncInterval) | nindent 12 }}
            {{- if .Values.agent.enabled }}
            - name: GSSH_AGENT_TLS_NAMES
              value: {{ include "guided-ssh.agentTLSNames" . | quote }}
            {{- if .Values.agent.proxyProtocol.enabled }}
            - name: GSSH_AGENT_PROXY_PROTOCOL
              value: "true"
            {{- include "guided-ssh.env" (dict "name" "GSSH_AGENT_PROXY_TRUSTED" "value" (join "," .Values.agent.proxyProtocol.trusted)) | nindent 12 }}
            {{- end }}
            {{- end }}
            {{- if .Values.config.auditStream.logs }}
            - name: GSSH_AUDIT_STREAM
              value: "true"
            {{- end }}
            {{- include "guided-ssh.env" (dict "name" "GSSH_AUDIT_WEBHOOK_URL" "value" .Values.config.auditStream.webhookURL) | nindent 12 }}
            {{- include "guided-ssh.env" (dict "name" "GSSH_AUDIT_STREAM_INTERVAL" "value" .Values.config.auditStream.interval) | nindent 12 }}
            {{- include "guided-ssh.rulesEnv" . | nindent 12 }}
            {{- include "guided-ssh.env" (dict "name" "GSSH_SIGN_RATE_PER_MINUTE" "value" .Values.config.rateLimit.perMinute) | nindent 12 }}
            {{- include "guided-ssh.env" (dict "name" "GSSH_SIGN_FAIL_PER_MINUTE" "value" .Values.config.rateLimit.failPerMinute) | nindent 12 }}
            {{- if .Values.config.rateLimit.trustProxy }}
            - name: GSSH_RATE_TRUST_PROXY
              value: "true"
            {{- end }}
            {{- if .Values.hostRollout.enabled }}
            {{- include "guided-ssh.hostRolloutEnv" . | nindent 12 }}
            {{- end }}
            {{- with .Values.config.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if .Values.agent.enabled }}
            - name: agent
              containerPort: {{ .Values.agent.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- $publicPinFile := and .Values.hostRollout.enabled (eq (default "dial" .Values.hostRollout.pin.source) "file") }}
          {{- $hostRules := .Values.config.rules.host.existingConfigMap }}
          {{- $ciRules := .Values.config.rules.ci.existingConfigMap }}
          {{- if or (eq (include "guided-ssh.caMode" .) "self-managed") $publicPinFile $hostRules $ciRules }}
          volumeMounts:
            {{- if eq (include "guided-ssh.caMode" .) "self-managed" }}
            - name: ca-keys
              mountPath: {{ .Values.secrets.ca.selfManaged.mountPath }}
              readOnly: true
            {{- end }}
            {{- if $publicPinFile }}
            # Without subPath: only this way does the kubelet update the mount after a
            # cert rotation (the server re-reads the file on every pin fetch).
            - name: public-tls
              mountPath: {{ include "guided-ssh.publicPinDir" . }}
              readOnly: true
            {{- end }}
            {{- if $hostRules }}
            # Also without subPath — a subPath mount never sees ConfigMap
            # updates, which would freeze the rules at pod start.
            - name: host-rules
              mountPath: {{ include "guided-ssh.rulesDir" (dict "domain" "host") }}
              readOnly: true
            {{- end }}
            {{- if $ciRules }}
            - name: ci-rules
              mountPath: {{ include "guided-ssh.rulesDir" (dict "domain" "ci") }}
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or .Values.internalDatabase.enabled (eq (include "guided-ssh.caMode" .) "self-managed") $publicPinFile $hostRules $ciRules }}
      volumes:
        {{- if .Values.internalDatabase.enabled }}
        # Ephemeral: pod restart = empty database (test environment).
        - name: internal-db-data
          emptyDir: {}
        {{- end }}
        {{- if eq (include "guided-ssh.caMode" .) "self-managed" }}
        {{- with .Values.secrets.ca.selfManaged }}
        # Only project the four CA files (not the whole secret): the
        # CA master key may live in the same secret without ending up as a file.
        # 0440 + podSecurityContext.fsGroup ⇒ only the server process reads them.
        - name: ca-keys
          secret:
            secretName: {{ .existingSecret }}
            defaultMode: 0440
            items:
              - key: {{ .keys.userKey }}
                path: {{ .keys.userKey }}
              - key: {{ .keys.hostKey }}
                path: {{ .keys.hostKey }}
              - key: {{ .keys.mtlsKey }}
                path: {{ .keys.mtlsKey }}
              - key: {{ .keys.mtlsCert }}
                path: {{ .keys.mtlsCert }}
        {{- end }}
        {{- end }}
        {{- if $publicPinFile }}
        # Only project tls.crt — the private key of the ingress certificate
        # has no business being in the server container.
        - name: public-tls
          secret:
            secretName: {{ .Values.hostRollout.pin.certSecretName }}
            defaultMode: 0444
            items:
              - key: tls.crt
                path: tls.crt
        {{- end }}
        {{- if $hostRules }}
        # items: projection onto the fixed file name — the env var stays
        # independent of the key, and the mount keeps receiving ConfigMap
        # updates (the server re-reads the file every 30 s).
        - name: host-rules
          configMap:
            name: {{ $hostRules }}
            items:
              - key: {{ .Values.config.rules.host.key }}
                path: rules.yaml
        {{- end }}
        {{- if $ciRules }}
        - name: ci-rules
          configMap:
            name: {{ $ciRules }}
            items:
              - key: {{ .Values.config.rules.ci.key }}
                path: rules.yaml
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
