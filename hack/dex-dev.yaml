# Throwaway OIDC IdP for trying out guided-ssh locally (see README "TL;DR").
#
#   docker run -d --name gssh-idp -p 5556:5556 \
#     -v "$PWD/hack/dex-dev.yaml:/etc/dex/config.yaml:ro" \
#     ghcr.io/dexidp/dex:latest dex serve /etc/dex/config.yaml
#
# The mock connector logs everyone in as a fixed identity ("Kilgore Trout",
# kilgore@kilgore.trout) that carries the group "authors" — so the admin role
# (GSSH_ADMIN_GROUP=authors) and group-based grants actually match. Dex's
# staticPasswords would look like the more obvious fake, but they carry no
# groups claim, and without groups no admin role and no grant ever matches.
#
# Never expose this anywhere: no authentication, memory storage.

issuer: http://127.0.0.1:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true

# Two separate clients, matching the server/client OIDC split:
#   gssh-cli    — public client (no secret) for the gssh/gssh-admin CLIs;
#                 Dex accepts the CLI's loopback redirect
#                 (http://127.0.0.1:<random port>/callback) automatically.
#   gssh-server — confidential client (WITH secret) for the server-side UI
#                 login (BFF): GSSH_SERVER_OIDC_CLIENT_ID=gssh-server,
#                 GSSH_SERVER_OIDC_CLIENT_SECRET=gssh-server-dev-secret.
#                 Confidential clients need the redirect URI listed explicitly.
staticClients:
  - id: gssh-cli
    name: gssh CLI
    public: true
  - id: gssh-server
    name: gssh server (UI login)
    secret: gssh-server-dev-secret
    redirectURIs:
      - http://127.0.0.1:8080/v1/auth/callback

connectors:
  - type: mockCallback
    id: mock
    name: mock
