version: "2"

linters:
  default: standard
  enable:
    - copyloopvar
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    misspell:
      # German words appearing in comments/output — not misspellings of "configuration"
      ignore-rules:
        - konfiguration
        - periodisch
        - verifikation
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    rules:
      # gosec is noise on test code: fixtures (fake IdP, deliberate redirects,
      # fixed hostnames) intentionally do "unsafe" things and are never
      # shipped. Covers, among others, the G710 open-redirect findings of the fake IdPs.
      - path: _test\.go
        linters:
          - gosec
      # internal/version is idiomatic; the collision with stdlib go/version is irrelevant here.
      - path: internal/version/
        text: "avoid package names that conflict with Go standard library"
        linters:
          - revive
      # internal/metrics is idiomatic; the collision with stdlib runtime/metrics is irrelevant here.
      - path: internal/metrics/
        text: "avoid package names that conflict with Go standard library"
        linters:
          - revive
      # internal/api is set as the HTTP API package in the project layout (ADR-001).
      - path: internal/api/
        text: "avoid meaningless package names"
        linters:
          - revive

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/guided-traffic/guided-ssh
