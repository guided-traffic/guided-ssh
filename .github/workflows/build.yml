name: Release Docker Image

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Versioned binaries + deb/rpm packages as release assets (Phase 13);
  # the version comes from git describe via the release tag (Makefile).
  binaries:
    name: Attach release binaries
    runs-on: self-hosted
    permissions:
      contents: write # attach assets to the GitHub release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe needs tags for the version info

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: go mod download

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build cross-platform binaries (version from git tag)
        run: make cross

      - name: Install nfpm and build packages (deb/rpm)
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          make packages

      - name: Generate checksums
        run: |
          cd bin && sha256sum gssh-* > ../dist/SHA256SUMS
          cd ../dist && sha256sum *.deb *.rpm >> SHA256SUMS

      - name: Attach assets to the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            bin/gssh-*
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS

  build:
    name: Build & Push Docker Image
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: guidedtraffic/guided-ssh
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
          labels: |
            org.opencontainers.image.title=guided-ssh
            org.opencontainers.image.description=SSH certificate authority with IdP-backed access control
            org.opencontainers.image.vendor=Guided Traffic
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=https://github.com/guided-traffic/guided-ssh

      - name: Determine build date
        id: buildinfo
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.buildinfo.outputs.date }}
          provenance: true
          sbom: true

  # Publish the Helm chart as a gh-pages Helm repo, in the same release run as
  # the binaries and image. Instead of chart-releaser (which creates its own
  # guided-ssh-*-releases and only drops the .tgz as release assets), the
  # package is committed directly to the gh-pages branch and index.yaml points
  # at the GitHub Pages URLs — modeled on
  # valkey-operator/.github/workflows/build.yml (release-helm-gh).
  #
  # version + appVersion come from the release tag; appVersion is the default
  # image tag (_helpers.tpl: default .Chart.AppVersion .Values.image.tag) — this
  # way the chart points at the same-named image of this release. The package
  # is additionally attached to the triggering vX.Y.Z release.
  helm-chart:
    name: Release Helm Chart (gh-pages)
    needs: build
    runs-on: self-hosted
    permissions:
      contents: write # write the gh-pages branch + attach the chart to the release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5

      # Chart version = app version from the release tag (vX.Y.Z ⇒ X.Y.Z). version
      # controls the repo chart version, appVersion the default image tag. The
      # values in Chart.yaml are only a lint baseline (ct check-version-increment)
      # and are overwritten here at release time.
      - name: Set chart version + appVersion from release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          echo "Release chart version: ${VERSION}"
          sed -i -E "s/^version:.*/version: ${VERSION}/" deploy/helm/guided-ssh/Chart.yaml
          sed -i -E "s/^appVersion:.*/appVersion: \"${VERSION}\"/" deploy/helm/guided-ssh/Chart.yaml

      - name: Resolve subchart dependencies
        run: helm dependency build deploy/helm/guided-ssh

      - name: Create Helm package
        run: |
          cd deploy/helm
          helm package guided-ssh/
          mkdir -p repo
          mv *.tgz repo/
          helm repo index repo/ --url https://guided-traffic.github.io/guided-ssh/

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      # runner.temp instead of /tmp: /tmp persists across runs on self-hosted
      # runners, so old chart packages would accumulate and get re-attached.
      - name: Cache chart package
        run: |
          rm -rf "$RUNNER_TEMP/helm-charts"
          mkdir -p "$RUNNER_TEMP/helm-charts"
          cp deploy/helm/repo/*.tgz "$RUNNER_TEMP/helm-charts/"

      - name: Check out gh-pages branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Pages
        run: |
          # Copy new charts into the root directory
          cp "$RUNNER_TEMP"/helm-charts/*.tgz .

          # Merge index.yaml with the existing index, if present
          if [ -f index.yaml ]; then
            mkdir -p temp-repo
            cp *.tgz temp-repo/
            helm repo index temp-repo/ --url https://guided-traffic.github.io/guided-ssh/ --merge index.yaml
            cp temp-repo/index.yaml .
            rm -rf temp-repo
          else
            helm repo index . --url https://guided-traffic.github.io/guided-ssh/
          fi

          git add --force *.tgz index.yaml
          git commit -m "Release Helm chart for $GITHUB_REF_NAME"
          git push --force origin gh-pages

      # Only the freshly packaged chart — a bare *.tgz glob here would match
      # every historical chart in the gh-pages worktree and attach them all.
      # index.yaml is not attached: it is the mutable repo index on gh-pages,
      # a frozen copy on the release would be stale and misleading.
      - name: Attach chart to the release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ runner.temp }}/helm-charts/*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
