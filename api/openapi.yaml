openapi: 3.0.3
info:
  title: guided-ssh API
  description: |
    REST API of the guided-ssh server: certificate issuance (human + CI),
    host enrollment, grant management, and the read/audit endpoints of the
    web UI. This specification is the single source of truth; the
    Angular API client is generated from it (`make web-api`).

    Authentication: OIDC ID token as bearer token. Roles of the admin API
    (phase 8): `admin` (everything), `auditor` (read/export audit + read),
    `readonly` (read resources); roles are mapped to IdP groups and are
    inclusive of one another (admin ⊃ auditor ⊃ readonly).
  version: "1.0"
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: /
tags:
  - name: system
  - name: ca
  - name: sign
  - name: enrollment
  - name: rollout
    description: One-command host install (agent manifest, binary download, install.sh, token minting)
  - name: client
    description: gssh client install (client manifest, binary download, client.sh)
  - name: grants
  - name: ci-grants
  - name: directory
    description: Read views for the web UI (hosts, users, groups, service accounts, certificates)
  - name: audit

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      tags: [system]
      summary: Liveness check
      security: []
      operationId: getHealth
      responses:
        "200":
          description: Server is alive
          content:
            text/plain:
              schema: { type: string }

  /v1/ui/config:
    get:
      tags: [system]
      summary: Bootstrap configuration for the web UI (public)
      security: []
      operationId: getUiConfig
      responses:
        "200":
          description: OIDC and role configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UiConfig" }

  /v1/auth/me:
    get:
      tags: [system]
      summary: Login state of the UI session (server-side OIDC, BFF)
      security: []
      operationId: getAuthMe
      responses:
        "200":
          description: Login state; unauthenticated ⇒ authenticated=false
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }

  /v1/auth/logout:
    post:
      tags: [system]
      summary: End UI session (delete session cookie)
      security: []
      operationId: postAuthLogout
      responses:
        "204":
          description: Session ended

  /v1/ca/bundle/{purpose}:
    get:
      tags: [ca]
      summary: CA bundle in authorized_keys format
      security: []
      operationId: getCaBundle
      parameters:
        - name: purpose
          in: path
          required: true
          schema: { type: string, enum: [user, host] }
      responses:
        "200":
          description: CA bundle
          content:
            text/plain:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/sign/user:
    post:
      tags: [sign]
      summary: Exchange ID token for SSH user certificate
      operationId: signUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignRequest" }
      responses:
        "200":
          description: Signed certificate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/sign/ci:
    post:
      tags: [sign]
      summary: Exchange GitLab job token for CI certificate
      operationId: signCi
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignRequest" }
      responses:
        "200":
          description: Signed certificate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/enroll:
    post:
      tags: [enrollment]
      summary: Host enrollment against a one-time token
      security: []
      operationId: enrollHost
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollRequest" }
      responses:
        "200":
          description: Host certificate and mTLS material
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/agents:
    get:
      tags: [rollout]
      summary: Agent manifest and rollout readiness (public)
      description: |
        Also responds with 200 when the rollout gate is closed and lists the
        missing conditions in `missing` (diagnostic source for the UI).
      security: []
      operationId: getAgentManifest
      responses:
        "200":
          description: Delivered binaries, rollout state, and active pin source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentManifest" }

  /v1/agents/{os}/{arch}:
    get:
      tags: [rollout]
      summary: Download agent binary (public, tightly rate-limited)
      security: []
      operationId: downloadAgent
      parameters:
        - { name: os, in: path, required: true, schema: { type: string, example: linux } }
        - { name: arch, in: path, required: true, schema: { type: string, example: amd64 } }
      responses:
        "200":
          description: Binary stream
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/RolloutUnavailable" }

  /install.sh:
    get:
      tags: [rollout]
      summary: Templated install script (public)
      security: []
      operationId: getInstallScript
      responses:
        "200":
          description: POSIX sh script with URLs, SPKI pin, and per-arch SHA-256
          content:
            text/x-shellscript:
              schema: { type: string }
        "503": { $ref: "#/components/responses/RolloutUnavailable" }

  /v1/clients:
    get:
      tags: [client]
      summary: Client manifest and client-install readiness (public)
      description: |
        Also responds with 200 when the client gate is closed and lists the
        missing conditions in `missing` (diagnostic source for the UI).
      security: []
      operationId: getClientManifest
      responses:
        "200":
          description: Delivered client binaries, gate state, and the offered SPKI pin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientManifest" }

  /v1/clients/{os}/{arch}:
    get:
      tags: [client]
      summary: Download gssh client binary (public, tightly rate-limited)
      description: |
        Shares the agent download's rate limiter (`GSSH_AGENT_DOWNLOAD_RPM`,
        per client IP).
      security: []
      operationId: downloadClient
      parameters:
        - { name: os, in: path, required: true, schema: { type: string, example: linux } }
        - { name: arch, in: path, required: true, schema: { type: string, example: amd64 } }
      responses:
        "200":
          description: Binary stream
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ClientUnavailable" }

  /client.sh:
    get:
      tags: [client]
      summary: Templated client install script (public)
      security: []
      operationId: getClientScript
      responses:
        "200":
          description: >-
            POSIX sh script with base URL, OIDC issuer/client ID, per-platform
            SHA-256, and — only from an operator-controlled source — the SPKI pin
          content:
            text/x-shellscript:
              schema: { type: string }
        "503": { $ref: "#/components/responses/ClientUnavailable" }

  /v1/admin/enroll-tokens:
    post:
      tags: [rollout]
      summary: Mint enrollment token for the one-command install (role admin)
      description: |
        The plaintext token is returned exactly once (never logged, never
        included in the audit payload). Gated like the other rollout
        endpoints.
      operationId: createEnrollToken
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollTokenRequest" }
      responses:
        "201":
          description: Token, expiry, and ready-to-use install command
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollTokenResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/RolloutUnavailable" }

  /v1/admin/grants:
    get:
      tags: [grants]
      summary: List access rules (role readonly)
      operationId: listGrants
      responses:
        "200":
          description: All grants
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Grant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [grants]
      summary: Create access rule (role admin)
      operationId: createGrant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GrantRequest" }
      responses:
        "201":
          description: Created grant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Grant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/grants/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [grants]
      summary: Read access rule (role readonly)
      operationId: getGrant
      responses:
        "200":
          description: Grant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Grant" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [grants]
      summary: Update access rule (role admin)
      operationId: updateGrant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GrantRequest" }
      responses:
        "200":
          description: Updated grant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Grant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [grants]
      summary: Delete access rule (role admin)
      operationId: deleteGrant
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/grants/apply:
    post:
      tags: [grants]
      summary: Declarative full reconciliation of grants (role admin)
      operationId: applyGrants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                grants:
                  type: array
                  items: { $ref: "#/components/schemas/GrantRequest" }
      responses:
        "200":
          description: Reconciliation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplyResult" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/admin/ci-grants:
    get:
      tags: [ci-grants]
      summary: List CI access rules (role readonly)
      operationId: listCiGrants
      responses:
        "200":
          description: All CI grants
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CiGrant" }
    post:
      tags: [ci-grants]
      summary: Create CI access rule (role admin)
      operationId: createCiGrant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CiGrantRequest" }
      responses:
        "201":
          description: Created CI grant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CiGrant" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/admin/ci-grants/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [ci-grants]
      summary: Read CI access rule (role readonly)
      operationId: getCiGrant
      responses:
        "200":
          description: CI grant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CiGrant" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [ci-grants]
      summary: Update CI access rule (role admin)
      operationId: updateCiGrant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CiGrantRequest" }
      responses:
        "200":
          description: Updated CI grant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CiGrant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [ci-grants]
      summary: Delete CI access rule (role admin)
      operationId: deleteCiGrant
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/ci-grants/apply:
    post:
      tags: [ci-grants]
      summary: Declarative full reconciliation of CI grants (role admin)
      operationId: applyCiGrants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ci_grants:
                  type: array
                  items: { $ref: "#/components/schemas/CiGrantRequest" }
      responses:
        "200":
          description: Reconciliation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplyResult" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/admin/hosts:
    get:
      tags: [directory]
      summary: Hosts with tags and certificate expiry (role readonly)
      operationId: listHosts
      responses:
        "200":
          description: All hosts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Host" }

  /v1/admin/users:
    get:
      tags: [directory]
      summary: Users with groups (role readonly)
      operationId: listUsers
      responses:
        "200":
          description: All users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }

  /v1/admin/groups:
    get:
      tags: [directory]
      summary: IdP groups (role readonly)
      operationId: listGroups
      responses:
        "200":
          description: All groups
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Group" }

  /v1/admin/service-accounts:
    get:
      tags: [directory]
      summary: Service accounts / CI identities (role readonly)
      operationId: listServiceAccounts
      responses:
        "200":
          description: All service accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ServiceAccount" }

  /v1/admin/service-accounts/{id}:
    patch:
      tags: [directory]
      summary: Activate/deactivate service account — kill switch (role admin)
      operationId: updateServiceAccount
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: { type: boolean }
      responses:
        "200":
          description: Updated service account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceAccount" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/certificates:
    get:
      tags: [directory]
      summary: Most recently issued certificates (role readonly)
      operationId: listCertificates
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 500 } }
      responses:
        "200":
          description: Certificate metadata, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Certificate" }

  /v1/admin/audit:
    get:
      tags: [audit]
      summary: Filter audit events (role auditor)
      description: |
        Filterable by event type, actor, time range, and full text (`q`
        matches actor and payload — covers host and pipeline filters).
      operationId: listAudit
      parameters:
        - { name: event_type, in: query, schema: { type: string } }
        - { name: actor, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string }, description: Substring match over actor and payload }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Filtered events with total count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditList" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/admin/audit/export:
    get:
      tags: [audit]
      summary: Audit export as CSV or JSON download (role auditor)
      operationId: exportAudit
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [json, csv], default: json } }
        - { name: event_type, in: query, schema: { type: string } }
        - { name: actor, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Download (max. 100000 rows)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEvent" }
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OIDC-ID-Token

  responses:
    BadRequest:
      description: Invalid request
      content:
        text/plain: { schema: { type: string } }
    Unauthorized:
      description: Token missing or invalid
      content:
        text/plain: { schema: { type: string } }
    Forbidden:
      description: Insufficient role/permission
      content:
        text/plain: { schema: { type: string } }
    NotFound:
      description: Not found
      content:
        text/plain: { schema: { type: string } }
    RolloutUnavailable:
      description: Host rollout not configured (missing conditions in `missing`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RolloutUnavailable" }
    ClientUnavailable:
      description: >-
        Client install not configured (missing conditions in `missing`). Same
        wire shape as the rollout 503, own — smaller — set of conditions.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RolloutUnavailable" }

  schemas:
    AuthSession:
      type: object
      required: [authenticated]
      properties:
        authenticated: { type: boolean }
        username: { type: string }
        roles:
          type: array
          items: { type: string, enum: [admin, auditor, readonly] }

    UiConfig:
      type: object
      required: [oidc_issuer, oidc_client_id, admin_group, auditor_group, readonly_group]
      properties:
        oidc_issuer: { type: string }
        oidc_client_id: { type: string }
        admin_group: { type: string }
        auditor_group: { type: string }
        readonly_group: { type: string }

    SignRequest:
      type: object
      required: [public_key]
      properties:
        public_key:
          type: string
          description: SSH public key in authorized_keys format
        validity_seconds:
          type: integer
          format: int64
          description: Requested validity; capped by policy and grants

    SignResponse:
      type: object
      required: [certificate, serial, key_id, principals, valid_after, valid_before]
      properties:
        certificate: { type: string }
        serial: { type: integer, format: int64 }
        key_id: { type: string }
        principals: { type: array, items: { type: string } }
        valid_after: { type: string, format: date-time }
        valid_before: { type: string, format: date-time }

    EnrollRequest:
      type: object
      required: [token, hostname, ssh_public_key, mtls_csr]
      properties:
        token: { type: string }
        hostname: { type: string }
        ssh_public_key: { type: string }
        mtls_csr: { type: string, description: PEM-encoded CSR for the mTLS client certificate }
        tags:
          type: object
          additionalProperties: { type: string }

    EnrollResponse:
      type: object
      required: [host_id, host_certificate, valid_before, user_ca_bundle, mtls_certificate, mtls_ca]
      properties:
        host_id: { type: string, format: uuid }
        host_certificate: { type: string }
        valid_before: { type: string, format: date-time }
        user_ca_bundle: { type: string }
        mtls_certificate: { type: string }
        mtls_ca: { type: string }

    AgentManifest:
      type: object
      required: [version, rollout_ready, missing, pin_source, pin_error, agents]
      properties:
        version: { type: string }
        rollout_ready: { type: boolean, description: false ⇒ rollout endpoints respond with 503 }
        missing:
          type: array
          description: >-
            Missing rollout conditions. The *_https entries report a URL that
            is set but not https — http never passes the gate.
          items:
            type: string
            enum:
              [
                binaries,
                pin,
                agent_public_url,
                public_url,
                agent_public_url_https,
                public_url_https,
              ]
        pin_source: { type: string, description: Active SPKI pin source (empty ⇒ no pin) }
        pin_error:
          type: string
          description: >-
            Coarse category of the last pin error (empty ⇒ none). No full
            text — that is only in the server log.
          enum: ["", no_public_url, chain_untrusted, dial_failed, cert_file_unreadable]
        agents:
          type: array
          items: { $ref: "#/components/schemas/AgentBinary" }

    AgentBinary:
      type: object
      required: [os, arch, size, sha256]
      properties:
        os: { type: string }
        arch: { type: string }
        size: { type: integer, format: int64 }
        sha256: { type: string, description: Hex SHA-256 (sha256sum-compatible) }

    RolloutUnavailable:
      type: object
      required: [error, missing]
      properties:
        error: { type: string }
        missing: { type: array, items: { type: string } }

    ClientManifest:
      type: object
      required: [version, ready, missing, pin, pin_source, clients]
      properties:
        version: { type: string }
        ready:
          type: boolean
          description: false ⇒ /v1/clients/{os}/{arch} and /client.sh respond with 503
        missing:
          type: array
          description: >-
            Missing client-install conditions. public_url_https reports a URL
            that is set but not https — http never passes the gate. The pin is
            deliberately not a condition (it is an opt-in, see the security model).
          items:
            type: string
            enum: [binaries, public_url, public_url_https, oidc_issuer, oidc_client_id]
        pin:
          type: string
          description: >-
            SPKI pin for the login-via-IP fallback, populated only from an
            operator-controlled source (static/file). Empty with an
            auto-derived (dial) pin: it rotates with the certificate and must
            never become a client's stored trust anchor.
        pin_source:
          type: string
          description: Active SPKI pin source (static|file|dial; empty ⇒ none configured)
        clients:
          type: array
          items: { $ref: "#/components/schemas/ClientBinary" }

    ClientBinary:
      type: object
      required: [os, arch, size, sha256]
      properties:
        os: { type: string }
        arch: { type: string }
        size: { type: integer, format: int64 }
        sha256: { type: string, description: Hex SHA-256 (sha256sum-compatible) }

    EnrollTokenRequest:
      type: object
      properties:
        hostname: { type: string, description: empty ⇒ token not bound to a hostname }
        tags:
          type: object
          additionalProperties: { type: string }
        ttl_seconds: { type: integer, format: int64, default: 3600, minimum: 60, maximum: 86400 }
        session_audit:
          type: boolean
          description: Only sets --session-audit in install_command; not stored on the token

    EnrollTokenResponse:
      type: object
      required: [token, expires_at, install_command]
      properties:
        token: { type: string, description: Plaintext, delivered exactly once }
        expires_at: { type: string, format: date-time }
        install_command: { type: string }

    Grant:
      type: object
      required: [id, group, issuer, tag_selector, principals, sudo, max_validity_seconds, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        group: { type: string, description: Group name in the IdP }
        issuer: { type: string }
        tag_selector:
          type: object
          additionalProperties: { type: string }
        principals: { type: array, items: { type: string } }
        sudo: { type: boolean }
        max_validity_seconds: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    GrantRequest:
      type: object
      required: [principals, max_validity_seconds]
      properties:
        group: { type: string, description: Required on POST }
        issuer: { type: string, description: empty ⇒ issuer of the admin token }
        tag_selector:
          type: object
          additionalProperties: { type: string }
        principals: { type: array, items: { type: string } }
        sudo: { type: boolean }
        max_validity_seconds: { type: integer, format: int64 }

    ApplyResult:
      type: object
      required: [created, updated, deleted, unchanged]
      properties:
        created: { type: integer }
        updated: { type: integer }
        deleted: { type: integer }
        unchanged: { type: integer }

    CiGrant:
      type: object
      required: [id, project, protected_only, tag_selector, principals, max_validity_seconds, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        project: { type: string, description: GitLab project or namespace path }
        ref_pattern: { type: string }
        protected_only: { type: boolean }
        environment_pattern: { type: string }
        tag_selector:
          type: object
          additionalProperties: { type: string }
        principals: { type: array, items: { type: string } }
        max_validity_seconds: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CiGrantRequest:
      type: object
      required: [principals, max_validity_seconds]
      properties:
        project: { type: string, description: Required on POST }
        ref_pattern: { type: string }
        protected_only: { type: boolean }
        environment_pattern: { type: string }
        tag_selector:
          type: object
          additionalProperties: { type: string }
        principals: { type: array, items: { type: string } }
        max_validity_seconds: { type: integer, format: int64 }

    Host:
      type: object
      required: [id, name, tags, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        tags:
          type: object
          additionalProperties: { type: string }
        enrolled_at: { type: string, format: date-time, nullable: true }
        last_seen_at: { type: string, format: date-time, nullable: true }
        cert_valid_before:
          type: string
          format: date-time
          nullable: true
          description: Latest valid_before among the host certificates
        created_at: { type: string, format: date-time }

    User:
      type: object
      required: [id, issuer, subject, username, email, active, groups, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        issuer: { type: string }
        subject: { type: string }
        username: { type: string }
        email: { type: string }
        active: { type: boolean }
        groups: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Group:
      type: object
      required: [id, issuer, name, created_at]
      properties:
        id: { type: string, format: uuid }
        issuer: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }

    ServiceAccount:
      type: object
      required: [id, name, kind, issuer, claim_matcher, active, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string }
        issuer: { type: string }
        claim_matcher:
          type: object
          additionalProperties: { type: string }
        active: { type: boolean, description: false acts as a kill switch per project }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Certificate:
      type: object
      required: [id, serial, key_id, cert_type, principals, valid_after, valid_before, created_at]
      properties:
        id: { type: string, format: uuid }
        serial: { type: integer, format: int64 }
        key_id: { type: string }
        cert_type: { type: string, enum: [user, host] }
        principals: { type: array, items: { type: string } }
        valid_after: { type: string, format: date-time }
        valid_before: { type: string, format: date-time }
        issuer_context:
          type: object
          description: Context of issuance (SSO session, CI pipeline claims)
        created_at: { type: string, format: date-time }

    AuditEvent:
      type: object
      required: [id, occurred_at, event_type, actor, payload]
      properties:
        id: { type: integer, format: int64 }
        occurred_at: { type: string, format: date-time }
        event_type:
          type: string
          description: e.g. cert.issued, grant.created/updated/deleted, host.enrolled, user.deactivated, service_account.updated
        actor: { type: string }
        payload:
          type: object
          description: Event details as JSON

    AuditList:
      type: object
      required: [events, total]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
        total:
          type: integer
          format: int64
          description: Total count for the filter (for pagination)
